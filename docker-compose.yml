version: "3.8"
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DB_DSN: root:secret@tcp(db:3306)/redikru?charset=utf8mb4&parseTime=True&loc=Local
      APP_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
